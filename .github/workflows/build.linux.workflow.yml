name: Build Linux

on:
  push:
    branches: [ master, experimental, experimental2 ]
  pull_request:
    branches: [ master, experimental, experimental2 ]
  release:
    types: [published]

jobs:
  build:
    name: "Build: ${{ matrix.arch }} ${{ matrix.os }} - ${{ matrix.upload_suffix }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        arch: [x64]
        config: [Release]
        statictype: [ON, OFF]
        include:
          - statictype: ON
            preset_suffix: ""
            upload_suffix: static
          - statictype: OFF
            preset_suffix: "-Dynamic"
            upload_suffix: shared

    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: workaround for default apt mirror connectivity issues
        run: |
          sudo sed -i 's/azure\.//' /etc/apt/sources.list

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils-m68k-linux-gnu binutils-z80 libudev-dev \
            autoconf autoconf-archive automake libtool

      - name: Install latest CMake
        uses: lukka/get-cmake@9388b6042e1c7b834f01bbd0c06739bc321414e5 # latest as of 2025-06-25

      - name: Restore artifacts, or setup vcpkg (do not install any package)
        uses: lukka/run-vcpkg@5ad8bfa6267ef808f7d48cf4004c879bed752401 # latest as of 2026-10-24
        with:
          # Latest vcpkg master as of 2026-10-24.
          vcpkgGitCommitId: 0c2a9ace1964b818b15f7ae50ba1c42404918a7b

      - name: Cache PCRE2 submodule metadata
        shell: bash
        run: python .github/scripts/cache-pcre2-gitlink.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: create install folder
        run: |
          mkdir -p "${{ github.workspace }}/tilibs.build/Linux-${{ matrix.arch }}/prefix"

      - name: Build and install tilibs ${{ matrix.config }} on Linux ${{ matrix.arch }}
        uses: lukka/run-cmake@c575fbf7e977dee9e825cfea913263f7c4377960 # latest as of 2026-10-24
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: 'Linux-${{ matrix.arch }}${{ matrix.preset_suffix }}'
          configurePresetAdditionalArgs: "['-DDEPS_RELEASE_ONLY=ON', '-DBUILD_ROM_DUMPERS=ON']"
          buildPreset: 'Linux-${{ matrix.arch }}${{ matrix.preset_suffix }}-${{ matrix.config }}'
          buildPresetAdditionalArgs: "['--target', 'check', 'install']"
        env:
          CMAKE_INSTALL_PREFIX_OVERRIDE: ${{ github.workspace }}/tilibs.build/Linux-${{ matrix.arch }}/prefix
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.arch }}-linux-release
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Upload install folder
        uses: actions/upload-artifact@v4
        with:
          name: tilibs_${{ matrix.os }}-${{ matrix.arch }}_${{ matrix.upload_suffix }}Deps
          path: ${{ github.workspace }}/tilibs.build/Linux-${{ matrix.arch }}/prefix
