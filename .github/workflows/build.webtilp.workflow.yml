name: Build WebTILP

on:
  push:
    branches: ['**']
    tags-ignore: ['webntilp-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.webtilp.assets.workflow.yml

  deploy:
    if: ${{ github.repository == 'adriweb/tilibs' && github.ref == 'refs/heads/exp2-full-emscripten' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: webtilp-github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
