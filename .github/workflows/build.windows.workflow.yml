name: Build Windows

on:
  push:
    branches: [ master, experimental, experimental2 ]
  pull_request:
    branches: [ master, experimental, experimental2 ]
  release:
    types: [published]

jobs:
  build:
    name: "Build: ${{ matrix.arch }} ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        arch: [x86,x64]
        config: [Release]

    steps:
      - name: Remove Perl Strawberry installation
        # Removes conflicting headers from include paths
        run: |
          Remove-Item -Recurse -Force C:/Strawberry

      - name: Checkout Git Repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install latest CMake
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # v4.5.1

      - name: Restore artifacts, or setup vcpkg (do not install any package)
        uses: lukka/run-vcpkg@d4e6061274d7ffb3e33694898aed9fb6ece66310 # latest as of 2026-11-28
        with:
          # Latest vcpkg master as of 2026-10-24.
          vcpkgGitCommitId: 0c2a9ace1964b818b15f7ae50ba1c42404918a7b

      - name: Cache PCRE2 submodule metadata
        shell: bash
        run: python .github/scripts/cache-pcre2-gitlink.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: create install folder
        run: |
          mkdir "${{ github.workspace }}/tilibs.build/Win-${{ matrix.arch }}/prefix"

      - name: Build and install tilibs ${{ matrix.config }} on Win ${{ matrix.arch }}
        uses: lukka/run-cmake@338027a0ca347414b3abaa50a883bdc2b91d1812 # latest as of 2026-11-28
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: 'Win-${{ matrix.arch }}'
          configurePresetAdditionalArgs: "['-DDEPS_RELEASE_ONLY=ON']"
          buildPreset: 'Win-${{ matrix.arch }}-${{ matrix.config }}'
          buildPresetAdditionalArgs: "['--target', 'check', 'install']"
        env:
          CMAKE_INSTALL_PREFIX_OVERRIDE: ${{ github.workspace }}/tilibs.build/Win-${{ matrix.arch }}/prefix
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static-release
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Verify static Windows dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt").Trim()
          $dumpbin = "$vs/VC/Tools/MSVC/$version/bin/Hostx64/x64/dumpbin.exe"
          $build = "${{ github.workspace }}/tilibs.build/Win-${{ matrix.arch }}"
          $executables = @(
            "$build/prefix/bin/tifileutil.exe",
            "$build/libticables/trunk/tests/Release/torture_ticables.exe",
            "$build/libticalcs/trunk/tests/Release/torture_ticalcs.exe"
          )
          foreach ($exe in $executables) {
            if (!(Test-Path $exe)) { throw "Missing executable: $exe" }
            $imports = & $dumpbin /DEPENDENTS $exe
            if ($LASTEXITCODE) { throw "dumpbin failed for $exe" }
            $imports | Write-Output
            if ($imports -match '(?i)\b(libusb0|vcruntime[a-z0-9_]*|msvcp[a-z0-9_]*|msvcr[0-9]+|ucrtbase|api-ms-win-crt-[a-z0-9-]+)\.dll') {
              throw "Unexpected libusb or shared MSVC runtime dependency in $exe"
            }
          }

      - name: Upload install folder
        uses: actions/upload-artifact@v7
        with:
          name: tilibs_${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/tilibs.build/Win-${{ matrix.arch }}/prefix
