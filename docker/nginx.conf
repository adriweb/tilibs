# WebTILP needs SharedArrayBuffer (pthreads), hence the COOP/COEP headers
# below — see webtilp/.htaccess for the Apache equivalent this mirrors.
# (nginx's stock mime.types already maps .wasm to application/wasm; a
# types{} override here would *replace*, not extend, that inherited map and
# break every other content type, so don't add one.)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Always re-validate the service worker and version manifest so clients
    # pick up new builds promptly instead of caching a stale one.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
