# WebTILP needs SharedArrayBuffer (pthreads), hence the COOP/COEP headers
# below — see webtilp/.htaccess for the Apache equivalent this mirrors.
# (nginx's stock mime.types already maps .wasm to application/wasm; a
# types{} override here would *replace*, not extend, that inherited map and
# break every other content type, so don't add one.)
# Keep all add_header directives at server scope: a location-level directive
# would suppress the inherited isolation headers in nginx 1.27.
map $uri $webtilp_cache_control {
    default "";
    /sw.js "no-cache";
    /version.json "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control $webtilp_cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }
}
