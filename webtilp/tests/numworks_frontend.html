<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WebTILP NumWorks frontend test</title>
</head>
<body>
<p id="loading">Loading WebTILP with a mocked NumWorks calculator…</p>
<script src="numworks_webusb_mock.js"></script>
<script>
    WebTILPNumWorksTest.installNumWorksWebUsbMock();
    localStorage.setItem('webtilp.settings', JSON.stringify({
        cableModel: 'auto',
        calcModel: 'auto',
        cableTimeout: 10,
        cableDelay: 10,
        language: 'en',
        convertPythonFiles: true
    }));
    fetch('../webtilp.html')
        .then(response => {
            if (!response.ok) {
                throw new Error(`Failed to load WebTILP (${response.status}).`);
            }
            return response.text();
        })
        .then(html => {
            const withBase = html.replace('<head>', '<head><base href="../">');
            document.open();
            document.write(withBase);
            document.close();
        })
        .catch(error => {
            document.getElementById('loading').textContent = error.message;
            console.error(error);
        });
</script>
</body>
</html>
